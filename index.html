<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Button Clicker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="juego">
        <h1>Button Clicker</h1>

        <div class="stats">
            <div class="stat-box">
                <span class="stat-val" id="clicks">0</span>
                <span class="stat-lbl">clicks</span>
            </div>
            <div class="stat-box">
                <span class="stat-val" id="cpc">1</span>
                <span class="stat-lbl">por click</span>
            </div>
            <div class="stat-box">
                <span class="stat-val" id="autoDisplay">0</span>
                <span class="stat-lbl">por segundo</span>
            </div>
        </div>

        <div class="btn-wrap">
            <button id="clickBtn">CLICK</button>
            <div id="fxLayer"></div>
        </div>

        <div class="tienda">
            <h2>Tienda</h2>

            <button onclick="comprarMultiplicador()">
                <span class="item-icon">👆</span>
                <span class="item-text">
                    Multiplicador de click (+1)<br>
                    <small>Costo: <span id="costoMulti">20</span></small>
                </span>
                <span class="item-owned">x<span id="ownedMulti">0</span></span>
            </button>

            <button onclick="comprarAutoClick()">
                <span class="item-icon">🤖</span>
                <span class="item-text">
                    Click automático (+1/seg)<br>
                    <small>Costo: <span id="costoAuto">50</span></small>
                </span>
                <span class="item-owned">x<span id="ownedAuto">0</span></span>
            </button>
        </div>

        <button id="guardarBtn">Guardar progreso</button>
        <p id="mensaje"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
